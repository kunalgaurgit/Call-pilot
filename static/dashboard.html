<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call Pilot — Supervisor Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container wide">
    <header>
      <div class="brand">
        <h1>Call Pilot Dashboard</h1>
        <span class="poll-tag">Live (3s poll)</span>
      </div>
      <a href="/index.html" class="nav-link">&larr; Call Assistant</a>
    </header>

    <div class="card live-card">
      <div class="controls-bar">
        <div class="ai-status">
          <span id="ai-pill" class="ai-pill ai-unknown">AI: checking…</span>
          <span id="ai-detail" class="ai-detail"></span>
          <button id="ai-recheck" class="btn-recheck" type="button">Re-check</button>
        </div>
        <div id="live-count" class="record-count">0 active calls</div>
      </div>
      <div id="ai-error" class="ai-error" hidden></div>
      <div id="live-feed" class="live-feed">
        <div class="live-empty">No calls yet. Conversations appear here live, with timestamps.</div>
      </div>
      <div class="live-foot">Full logs with millisecond timestamps: <code>logs/calls-YYYY-MM-DD.jsonl</code></div>
    </div>

    <div class="card">
      <div class="controls-bar">
        <div class="filter-group">
          <label for="business-filter">Business:</label>
          <select id="business-filter">
            <option value="">All Businesses</option>
          </select>
        </div>
        <div id="record-count" class="record-count">Loading...</div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Business</th>
              <th>Status</th>
              <th>Summary</th>
              <th>PDF</th>
            </tr>
          </thead>
          <tbody id="records-table-body">
            <tr class="empty-row">
              <td colspan="5">Loading records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Details View -->
    <div id="details-section" class="card details-card" style="display: none;">
      <div class="details-header">
        <h2 class="details-title">Record Details</h2>
      </div>
      <pre id="record-details-pre"></pre>
    </div>
  </div>

  <script>
    let selectedRecordKey = null;
    let recordsData = [];

    const businessFilter = document.getElementById("business-filter");
    const recordsTableBody = document.getElementById("records-table-body");
    const recordCountEl = document.getElementById("record-count");
    const detailsSection = document.getElementById("details-section");
    const recordDetailsPre = document.getElementById("record-details-pre");

    // Populate business filter dropdown
    async function loadConfigs() {
      try {
        const res = await fetch("/api/configs");
        if (res.ok) {
          const configs = await res.json();
          configs.forEach(cfg => {
            const opt = document.createElement("option");
            opt.value = cfg.id;
            opt.textContent = cfg.business;
            businessFilter.appendChild(opt);
          });
        }
      } catch (err) {
        console.error("Failed to load configs:", err);
      }
    }

    // Format ISO string to readable localized date-time
    function formatTime(isoStr) {
      if (!isoStr) return "—";
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch {
        return isoStr;
      }
    }

    // Render table rows strictly using textContent
    function renderTable(records) {
      recordsTableBody.innerHTML = "";

      if (!records || records.length === 0) {
        const row = document.createElement("tr");
        row.className = "empty-row";
        const td = document.createElement("td");
        td.colSpan = 5;
        td.textContent = "No records found.";
        row.appendChild(td);
        recordsTableBody.appendChild(row);
        recordCountEl.textContent = "0 records";
        return;
      }

      recordCountEl.textContent = records.length + (records.length === 1 ? " record" : " records");

      records.forEach(rec => {
        const tr = document.createElement("tr");
        const key = rec.id || rec.session_id;

        if (key && key === selectedRecordKey) {
          tr.classList.add("selected");
        }

        // Time
        const tdTime = document.createElement("td");
        tdTime.className = "time-cell";
        tdTime.textContent = formatTime(rec.ended_at || rec.started_at || rec.created_at);
        tr.appendChild(tdTime);

        // Business
        const tdBiz = document.createElement("td");
        tdBiz.className = "biz-cell";
        tdBiz.textContent = rec.business || rec.business_id || "—";
        tr.appendChild(tdBiz);

        // Status badge
        const tdStatus = document.createElement("td");
        const badge = document.createElement("span");
        const statusVal = (rec.status || "unknown").toLowerCase();
        badge.className = "badge badge-" + statusVal;
        badge.textContent = statusVal;
        tdStatus.appendChild(badge);
        tr.appendChild(tdStatus);

        // Summary
        const tdSummary = document.createElement("td");
        tdSummary.className = "summary-cell";
        tdSummary.textContent = rec.summary || "—";
        tr.appendChild(tdSummary);

        // PDF column
        const tdPdf = document.createElement("td");
        tdPdf.className = "pdf-cell";
        const bookingId = rec.booking_id || (rec.fields && rec.fields.booking_id);
        if (rec.session_id && bookingId) {
          const pdfLink = document.createElement("a");
          pdfLink.href = "/api/bookings/" + encodeURIComponent(rec.session_id) + "/pdf";
          pdfLink.className = "btn-pdf-small";
          pdfLink.textContent = "PDF";
          pdfLink.target = "_blank";
          pdfLink.setAttribute("download", bookingId + ".pdf");
          pdfLink.addEventListener("click", (e) => e.stopPropagation());
          tdPdf.appendChild(pdfLink);
        } else {
          tdPdf.textContent = "—";
        }
        tr.appendChild(tdPdf);

        // Click row -> show record details
        tr.addEventListener("click", () => {
          selectedRecordKey = key;
          document.querySelectorAll("#records-table-body tr").forEach(r => r.classList.remove("selected"));
          tr.classList.add("selected");
          showDetails(rec);
        });

        recordsTableBody.appendChild(tr);
      });

      // Maintain selection if already chosen
      if (selectedRecordKey) {
        const found = records.find(r => (r.id || r.session_id) === selectedRecordKey);
        if (found) {
          showDetails(found);
        }
      }
    }

    function showDetails(record) {
      detailsSection.style.display = "flex";
      recordDetailsPre.textContent = JSON.stringify(record, null, 2);

      const bookingId = record.booking_id || (record.fields && record.fields.booking_id);
      let pdfBtn = document.getElementById("details-pdf-btn");
      if (record.session_id && bookingId) {
        if (!pdfBtn) {
          pdfBtn = document.createElement("a");
          pdfBtn.id = "details-pdf-btn";
          pdfBtn.className = "btn-pdf-small";
          pdfBtn.target = "_blank";
          pdfBtn.textContent = "Download PDF Slip";
          detailsSection.querySelector(".details-header").appendChild(pdfBtn);
        }
        pdfBtn.href = "/api/bookings/" + encodeURIComponent(record.session_id) + "/pdf";
        pdfBtn.style.display = "inline-flex";
      } else if (pdfBtn) {
        pdfBtn.style.display = "none";
      }
    }

    // Fetch records from /api/records
    async function fetchRecords() {
      const selectedBiz = businessFilter.value;
      const url = selectedBiz ? "/api/records?business_id=" + encodeURIComponent(selectedBiz) : "/api/records";

      try {
        const res = await fetch(url);
        if (!res.ok) return;
        recordsData = await res.json();
        renderTable(recordsData);
      } catch (err) {
        console.error("Failed to load records:", err);
      }
    }

    businessFilter.addEventListener("change", () => {
      selectedRecordKey = null;
      detailsSection.style.display = "none";
      fetchRecords();
    });

    // Initial load
    loadConfigs().then(fetchRecords);

    // Polling every 3s, skipping while document is hidden
    setInterval(() => {
      if (!document.hidden) {
        fetchRecords();
      }
    }, 3000);

    // ---- AI status + live conversations ----
    const aiPill = document.getElementById("ai-pill");
    const aiDetail = document.getElementById("ai-detail");
    const aiError = document.getElementById("ai-error");
    const liveFeed = document.getElementById("live-feed");
    const liveCount = document.getElementById("live-count");
    const ROLE_LABEL = { caller: "Caller", agent: "Agent", tool: "Tool", error: "Error", system: "System" };
    const calls = new Map(); // sid -> {events: [], el}
    let lastSeq = 0;
    let activeSids = new Set();

    function clock(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderAi(status) {
      const ai = status.ai || {};
      const labels = { ok: "AI connected", error: "AI error", demo: "Demo mode (no AI)", unknown: "AI: checking…" };
      aiPill.className = "ai-pill ai-" + (ai.state || "unknown");
      aiPill.textContent = labels[ai.state] || labels.unknown;
      const paused = Object.entries(status.paused_models || {})
        .map(([m, s]) => m + " paused (busy or out of quota, back in " + (s >= 3600 ? Math.round(s / 3600) + "h" : Math.ceil(s / 60) + "m") + ")");
      aiDetail.textContent = (status.mode === "gemini" ? status.model : "") +
        (ai.checked_at ? " · last checked " + clock(ai.checked_at) : "") +
        (paused.length ? " · " + paused.join(", ") : "");
      aiError.hidden = ai.state !== "error";
      aiError.textContent = ai.error || "";
      const n = status.active_calls || 0;
      liveCount.textContent = n + (n === 1 ? " active call" : " active calls");
    }

    async function fetchStatus() {
      try {
        const res = await fetch("/api/status");
        if (res.ok) renderAi(await res.json());
      } catch (err) {
        aiPill.className = "ai-pill ai-error";
        aiPill.textContent = "Server unreachable";
      }
    }

    document.getElementById("ai-recheck").addEventListener("click", async (e) => {
      e.target.disabled = true;
      try { await fetch("/api/ai/check", { method: "POST" }); } catch {}
      await fetchStatus();
      e.target.disabled = false;
    });

    function callCard(sid) {
      let call = calls.get(sid);
      if (call) return call;
      const el = document.createElement("div");
      el.className = "live-call";
      const head = document.createElement("div");
      head.className = "live-call-head";
      const title = document.createElement("span");
      title.className = "live-call-title";
      const state = document.createElement("span");
      state.className = "live-call-state";
      head.append(title, state);
      const body = document.createElement("div");
      body.className = "live-call-body";
      el.append(head, body);
      call = { el, title, state, body, started: null };
      calls.set(sid, call);
      return call;
    }

    function addEvent(ev) {
      const sid = ev.sid || "server";
      const call = callCard(sid);
      if (!call.started) {
        call.started = ev.ts;
        call.title.textContent = "Call " + sid.slice(0, 6) + " · " + clock(ev.ts) + (ev.client ? " · " + ev.client : "");
      }
      const row = document.createElement("div");
      row.className = "live-msg live-" + ev.role;
      const time = document.createElement("span");
      time.className = "live-time";
      time.textContent = clock(ev.ts);
      const who = document.createElement("span");
      who.className = "live-who";
      who.textContent = ROLE_LABEL[ev.role] || ev.role;
      const text = document.createElement("span");
      text.className = "live-text";
      text.textContent = ev.text + (ev.ms != null && ev.role === "agent" ? "  (" + (ev.ms / 1000).toFixed(1) + "s)" : "");
      row.append(time, who, text);
      call.body.appendChild(row);
      call.body.scrollTop = call.body.scrollHeight;
      liveFeed.prepend(call.el); // most recently active call on top
    }

    async function fetchLive() {
      try {
        const res = await fetch("/api/live?after=" + lastSeq);
        if (!res.ok) return;
        const data = await res.json();
        const events = data.events || [];
        if (events.length && events[0].seq <= lastSeq) { // server restarted: start over
          calls.clear();
          liveFeed.innerHTML = "";
        }
        if (events.length) {
          liveFeed.querySelector(".live-empty")?.remove();
          events.forEach(addEvent);
          lastSeq = events[events.length - 1].seq;
        }
        activeSids = new Set(data.active || []);
        calls.forEach((call, sid) => {
          const live = activeSids.has(sid);
          call.state.textContent = live ? "live" : "ended";
          call.el.classList.toggle("is-live", live);
        });
      } catch (err) {
        console.error("Failed to load live feed:", err);
      }
    }

    fetchStatus();
    fetchLive();
    setInterval(() => {
      if (!document.hidden) {
        fetchLive();
        fetchStatus();
      }
    }, 1000);
  </script>
</body>
</html>
